name: Update the Google Play listing

# Uploads the store texts and graphics from fastlane/metadata/android and sends them for review
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-store-publishing
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_OPT_OUT_USAGE: 'true'
      FASTLANE_SKIP_DOCS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Configure Play credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]] || { echo 'Configure PLAY_SERVICE_ACCOUNT_JSON first.'; exit 1; }
          umask 077
          PLAY_JSON_KEY="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_JSON_KEY"
          echo "PLAY_JSON_KEY=$PLAY_JSON_KEY" >> "$GITHUB_ENV"
      - name: Upload the store listing
        run: bundle exec fastlane android upload_listing
