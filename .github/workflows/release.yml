name: Release

# Push a version tag to release, e.g.: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: [ 'v*.*.*' ]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JAVA_VERSION: '21'

    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Check that the tag matches versionName
      run: |
        VERSION_NAME=${GITHUB_REF_NAME#v}
        grep -q "versionName = \"$VERSION_NAME\"" app/build.gradle.kts \
          || { echo "::error::Set versionName to $VERSION_NAME and bump versionCode in app/build.gradle.kts"; exit 1; }
        echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

    - name: Run Detekt
      run: ./gradlew detekt
    - name: Run Lint
      run: ./gradlew lintRelease
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Build APK and App Bundle
      env:
        RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      run: |
        mkdir credentials
        echo "$RELEASE_KEYSTORE" | base64 -d > credentials/keystore.jks
        ./gradlew assembleRelease bundleRelease
        cp app/build/outputs/apk/release/app-release.apk "pdfwallet-$VERSION_NAME.apk"
        cp app/build/outputs/bundle/release/app-release.aab "pdfwallet-$VERSION_NAME.aab"

    - name: Remove credentials
      if: always()
      run: rm -rf credentials

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" "pdfwallet-$VERSION_NAME.apk" "pdfwallet-$VERSION_NAME.aab" \
          --title "$VERSION_NAME" \
          --verify-tag \
          --generate-notes \
          --latest

    - name: Upload test reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: test_reports
        path: |
          */build/reports/detekt/detekt.html
          */build/reports/lint-results-release.html
          */build/reports/tests/testDebugUnitTest/

  website:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    secrets:
      RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}

  # enable by setting the repository variable PLAY_PUBLISHING to true, see play/SUBMISSION.txt
  publish-play-store:
    needs: release
    if: ${{ vars.PLAY_PUBLISHING == 'true' }}
    uses: ./.github/workflows/publish-play-store.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
