# Overrides of the default detekt configuration, mainly for Jetpack Compose conventions.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: false
complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Composable']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
